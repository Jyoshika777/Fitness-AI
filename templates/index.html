<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FitAI - AI Fitness Planner</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #111827,
                    #172554
                );

            min-height: 100vh;

            color: white;
        }


        /* HEADER */

        header {
            text-align: center;

            padding: 50px 20px 30px;
        }


        .logo {
            font-size: 42px;
            font-weight: 800;

            margin-bottom: 10px;
        }


        .logo span {
            color: #38bdf8;
        }


        header p {
            color: #cbd5e1;
            font-size: 17px;
        }


        /* MAIN */

        .container {
            width: 90%;
            max-width: 1000px;

            margin: auto;

            padding-bottom: 50px;
        }


        /* CARD */

        .card {
            background: rgba(255,255,255,0.08);

            backdrop-filter: blur(15px);

            border: 1px solid rgba(255,255,255,0.12);

            border-radius: 24px;

            padding: 35px;

            box-shadow:
                0 20px 50px rgba(0,0,0,0.35);

            margin-bottom: 30px;
        }


        .card h2 {
            margin-bottom: 25px;

            font-size: 24px;
        }


        /* FORM */

        .grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;
        }


        .field {
            display: flex;
            flex-direction: column;
        }


        .field.full {
            grid-column: 1 / 3;
        }


        label {
            margin-bottom: 8px;

            font-size: 14px;

            color: #cbd5e1;

            font-weight: bold;
        }


        input,
        select,
        textarea {

            width: 100%;

            padding: 14px;

            border-radius: 12px;

            border: 1px solid
                rgba(255,255,255,0.15);

            background: rgba(15,23,42,0.8);

            color: white;

            font-size: 15px;

            outline: none;
        }


        input:focus,
        select:focus,
        textarea:focus {

            border-color: #38bdf8;

            box-shadow:
                0 0 0 2px
                rgba(56,189,248,0.15);
        }


        textarea {
            height: 100px;

            resize: none;
        }


        option {
            background: #111827;
            color: white;
        }


        /* BUTTON */

        button {

            width: 100%;

            margin-top: 25px;

            padding: 16px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    90deg,
                    #06b6d4,
                    #3b82f6
                );

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 10px 25px
                rgba(59,130,246,0.35);
        }


        /* RESULT */

        .result {

            margin-top: 25px;

            background:
                rgba(15,23,42,0.8);

            border-radius: 16px;

            padding: 25px;

            white-space: pre-wrap;

            line-height: 1.7;

            color: #e2e8f0;
        }


        /* FOOTER */

        footer {

            text-align: center;

            color: #64748b;

            padding: 20px;
        }


        /* MOBILE */

        @media(max-width:700px) {

            .grid {
                grid-template-columns: 1fr;
            }

            .field.full {
                grid-column: 1;
            }

            .card {
                padding: 22px;
            }

            .logo {
                font-size: 34px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        Fit<span>AI</span>
    </div>

    <p>
        Your Personal AI Fitness Planner
    </p>

</header>


<div class="container">


    <!-- INPUT CARD -->

    <div class="card">

        <h2>💪 Create Your Fitness Plan</h2>


        <form method="POST">

            <div class="grid">


                <div class="field">

                    <label>Age</label>

                    <input
                        type="number"
                        name="age"
                        placeholder="e.g. 22"
                        required
                    >

                </div>


                <div class="field">

                    <label>Height (cm)</label>

                    <input
                        type="number"
                        name="height"
                        placeholder="e.g. 165"
                        required
                    >

                </div>


                <div class="field">

                    <label>Weight (kg)</label>

                    <input
                        type="number"
                        name="weight"
                        placeholder="e.g. 60"
                        required
                    >

                </div>


                <div class="field">

                    <label>Fitness Goal</label>

                    <select name="goal" required>

                        <option value="">
                            Select goal
                        </option>

                        <option>
                            General Fitness
                        </option>

                        <option>
                            Weight Loss
                        </option>

                        <option>
                            Muscle Gain
                        </option>

                        <option>
                            Strength
                        </option>

                        <option>
                            Endurance
                        </option>

                    </select>

                </div>


                <div class="field">

                    <label>Experience Level</label>

                    <select
                        name="experience"
                        required
                    >

                        <option value="">
                            Select level
                        </option>

                        <option>
                            Beginner
                        </option>

                        <option>
                            Intermediate
                        </option>

                        <option>
                            Advanced
                        </option>

                    </select>

                </div>


                <div class="field">

                    <label>Workout Days / Week</label>

                    <input
                        type="number"
                        name="days"
                        min="1"
                        max="7"
                        placeholder="e.g. 4"
                        required
                    >

                </div>


                <div class="field">

                    <label>Workout Duration</label>

                    <input
                        type="number"
                        name="duration"
                        placeholder="Minutes"
                        required
                    >

                </div>


                <div class="field">

                    <label>Equipment</label>

                    <input
                        type="text"
                        name="equipment"
                        placeholder="None / Dumbbells"
                        required
                    >

                </div>


                <div class="field full">

                    <label>
                        Workout Preferences
                    </label>

                    <textarea
                        name="preferences"
                        placeholder="Example: Home workout, yoga, low impact..."
                        required
                    ></textarea>

                </div>


            </div>


            <button type="submit">

                ✨ Generate My AI Fitness Plan

            </button>


        </form>

    </div>


    <!-- RESULT CARD -->

    {% if plan %}

    <div class="card">

        <h2>🎯 Your Personalized Plan</h2>

        <div class="result">

            {{ plan }}

        </div>

    </div>

    {% endif %}


</div>


<footer>

    Powered by Ollama • Llama 3.2 • LangGraph

</footer>


</body>

</html>
